<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lunar volatile loss graph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  :root {
    --mare: #1c2027;
    --mare-deep: #13161b;
    --highland: #f1efe9;
    --highland-2: #e7e4dc;
    --ink: #1e2228;
    --ink-soft: #5a6270;
    --hair: #d9d5cc;
    --hair-dark: #2c323b;
    --star: #cfd3da;
    --gold: #e9b949;
    --sans: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
    --serif: "IBM Plex Serif", Georgia, "Times New Roman", serif;
    --c-mechanism: #f08a3e;
    --c-framework: #b48ee6;
    --c-isotope: #e9b949;
    --c-code: #6fbf73;
    --c-sample: #c8a26b;
    --c-constraint: #5fc3c9;
    --k-measurement: #7fa7e8;
    --k-experiment: #4fb3a3;
    --k-model: #9a8cf0;
    --k-theory: #d98bc9;
    --k-review: #a9b4c2;
    --k-code: #8fd08a;
    --k-context: #6e7883;
    --e-support: #c9cbb9;
    --e-conflict: #e36a6a;
    --e-structure: #7c8797;
    --e-data: #b8a25a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--sans); font-size: 14px; line-height: 1.45; color: var(--ink);
    display: grid; grid-template-columns: minmax(0, 1fr) 390px; height: 100vh; overflow: hidden;
    background: var(--mare);
  }
  button, input { font: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* ---------- stage (dark, "mare") ---------- */
  .stage { display: flex; flex-direction: column; min-width: 0; color: var(--star);
    background: radial-gradient(120% 90% at 50% 40%, var(--mare) 0%, var(--mare-deep) 100%); }
  .stage header { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: end; padding: 16px 20px 12px;
    border-bottom: 1px solid var(--hair-dark); }
  .stage h1 { font-family: var(--serif); font-weight: 600; font-size: 20px; margin: 0; letter-spacing: -0.01em; color: #fff; }
  .stage h1 small { display: block; font-family: var(--sans); font-weight: 400; font-size: 12.5px; color: #9aa3b0; margin-top: 3px; }
  .tools { display: flex; gap: 8px; align-items: center; margin-left: auto; flex-wrap: wrap; }
  .search { position: relative; }
  .search input { width: 260px; max-width: 46vw; padding: 7px 10px 7px 30px; border-radius: 6px; border: 1px solid #3a414c;
    background: #262b33; color: #fff; }
  .search input::placeholder { color: #8b94a1; }
  .search svg { position: absolute; left: 9px; top: 9px; width: 14px; height: 14px; stroke: #8b94a1; fill: none; stroke-width: 2; }
  .tools button { padding: 7px 11px; border-radius: 6px; border: 1px solid #3a414c; background: #262b33; color: #e6e9ee; }
  .tools button:hover { background: #303640; }
  .canvas { position: relative; flex: 1; min-height: 0; }
  .canvas svg { width: 100%; height: 100%; display: block; cursor: grab; }
  .canvas svg:active { cursor: grabbing; }
  .hint { position: absolute; left: 16px; bottom: 12px; font-size: 12px; color: #8b94a1; pointer-events: none; }
  .tooltip { position: absolute; pointer-events: none; display: none; max-width: 300px; padding: 8px 10px; border-radius: 6px;
    background: rgba(20,23,28,.94); border: 1px solid #3a414c; color: #eef1f5; font-size: 12.5px; z-index: 5; }
  .tooltip b { display: block; font-family: var(--serif); font-weight: 600; font-size: 13.5px; margin-bottom: 2px; }

  /* nodes & links */
  .links line { stroke-opacity: .55; transition: stroke-opacity .15s; }
  .links line.support { stroke: var(--e-support); }
  .links line.conflict { stroke: var(--e-conflict); stroke-dasharray: 5 4; stroke-opacity: .8; }
  .links line.structure { stroke: var(--e-structure); }
  .links line.data { stroke: var(--e-data); stroke-opacity: .35; }
  .links line.dim { stroke-opacity: .06; }
  .links line.lit { stroke-opacity: 1; stroke-width: 2.2px; }
  .node { cursor: pointer; }
  .node circle, .node rect { stroke: var(--mare-deep); stroke-width: 1.5px; transition: opacity .15s; }
  .node.dim circle, .node.dim rect { opacity: .18; }
  .node.dim text { opacity: .08; }
  .node.lit circle, .node.lit rect { stroke: #fff; stroke-width: 2px; }
  .node.selected circle, .node.selected rect { stroke: var(--gold); stroke-width: 3px; }
  .node text { font-family: var(--sans); font-size: 10.5px; fill: #e6e9ee; text-anchor: middle; pointer-events: none;
    paint-order: stroke; stroke: var(--mare-deep); stroke-width: 3px; stroke-linejoin: round; transition: opacity .15s; }
  .node text.concept-label { font-weight: 600; font-size: 11.5px; }
  .zoomed-out .node text.paper-label { visibility: hidden; }
  .zoomed-out .node.lit text.paper-label, .zoomed-out .node.selected text.paper-label { visibility: visible; }

  /* ---------- panel (light, "highlands") ---------- */
  .panel { background: var(--highland); border-left: 1px solid var(--hair); overflow-y: auto; min-height: 0; }
  .panel section { padding: 16px 18px; border-bottom: 1px solid var(--hair); }
  .panel h2 { font-family: var(--serif); font-weight: 600; font-size: 15px; margin: 0 0 10px; }
  .panel h3 { font-size: 12.5px; font-weight: 600; color: var(--ink-soft); margin: 14px 0 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px 4px 6px; border-radius: 999px; border: 1px solid var(--hair);
    background: #fff; font-size: 12px; user-select: none; }
  .chip input { margin: 0; accent-color: var(--ink); }
  .chip i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .chip i.sq { border-radius: 3px; }
  .chip i.ln { width: 16px; height: 0; border-top: 2px solid; border-radius: 0; }
  .chip i.ln.dash { border-top-style: dashed; }
  .chip.off { opacity: .45; }

  .dossier .type { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-soft); }
  .dossier .type i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .dossier .name { font-family: var(--serif); font-weight: 600; font-size: 19px; line-height: 1.25; margin: 6px 0 4px; }
  .dossier .title { font-family: var(--serif); font-style: italic; font-size: 14.5px; margin: 0 0 6px; }
  .dossier .meta { font-size: 12.5px; color: var(--ink-soft); margin: 0 0 8px; }
  .dossier .note { margin: 0 0 10px; }
  .dossier .actions { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 6px; }
  .dossier .actions a, .dossier .actions button { font-size: 12.5px; padding: 5px 9px; border-radius: 6px; border: 1px solid var(--hair);
    background: #fff; color: var(--ink); text-decoration: none; }
  .dossier .actions a:hover, .dossier .actions button:hover { background: var(--highland-2); }
  .edge-list { list-style: none; margin: 0; padding: 0; }
  .edge-list li { padding: 7px 0; border-top: 1px solid var(--hair); }
  .edge-list li:first-child { border-top: 0; }
  .edge-list .rel { font-size: 12px; color: var(--ink-soft); }
  .edge-list .rel button { background: none; border: 0; padding: 0; color: var(--ink); font-weight: 600; text-decoration: underline;
    text-decoration-color: var(--hair); text-underline-offset: 2px; }
  .edge-list .rel button:hover { text-decoration-color: var(--ink); }
  .edge-list .ev { font-size: 12.5px; margin-top: 2px; }
  .edge-list .prov { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }
  .prov.k { color: #a04a2e; }
  .group-h { display: flex; align-items: center; gap: 8px; margin: 14px 0 4px; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); }
  .group-h i { width: 16px; border-top: 2px solid; display: inline-block; }
  .group-h i.dash { border-top-style: dashed; }

  /* overview: evidence balance */
  .balance { list-style: none; margin: 0; padding: 0; }
  .balance li { display: grid; grid-template-columns: 1fr 96px; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--hair); }
  .balance li:first-child { border-top: 0; }
  .balance button { background: none; border: 0; padding: 0; text-align: left; color: var(--ink); font-size: 13px; }
  .balance button:hover { text-decoration: underline; }
  .balance .bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--highland-2); }
  .balance .bar b { display: block; height: 100%; }
  .balance .bar .for { background: #6f8f5c; }
  .balance .bar .against { background: var(--e-conflict); }
  .balance .n { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }
  .counts { font-size: 12.5px; color: var(--ink-soft); margin: 0 0 8px; }
  .kbd { font-size: 11px; color: var(--ink-soft); }

  @media (max-width: 860px) {
    body { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) 44vh; }
    .panel { border-left: 0; border-top: 1px solid var(--hair); }
    .search input { width: 180px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <div class="stage">
    <header>
      <h1>Lunar volatile loss graph
        <small id="subtitle">Papers, mechanisms, isotope systems and constraints, linked by what each study claims</small>
      </h1>
      <div class="tools">
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>

        <button id="reset" type="button">Reset view</button>
        <button id="download" type="button">Download JSON</button>
      </div>
    </header>
    <div class="canvas" id="canvas">
      <svg id="graph" role="img" aria-label="Force-directed knowledge graph"></svg>
      <div class="tooltip" id="tooltip"></div>
      <div class="hint">Drag to move, scroll to zoom, click a node to open its dossier, Esc to clear</div>
    </div>
  </div>

  <aside class="panel">
    <section id="filters">

      <h3>Links</h3>
      <div class="chips" id="class-chips"></div>

    <section class="dossier" id="dossier"></section>
  </aside>

": "S"}, {"source": "hyodo2018", "rel": "supports", "target": "mech_tidal", "evidence": "Radiation pressure on µm condensates from a hot early Earth would remove them from the system", "prov": "M25"}, {"source": "kegerreis2022", "rel": "constrains", "target": "c_orbit", "evidence": "Direct formation at ~7 R_E from a high-energy oblique impact", "prov": "M25"}, {"source": "kegerreis2022", "rel": "challenges", "target": "mech_disk", "evidence": "The Moon may form immediately, without a protolunar disk", "prov": "M25"}, {"source": "salmoncanup2012", "rel": "constrains", "target": "c_orbit", "evidence": "Moon fully forms at ~5 R_E from a Roche-interior disk, e ≈ 0.01", "prov": "M25"}, {"source": "cukstewart2012", "rel": "constrains", "target": "c_orbit", "evidence": "Evection-resonance history; k2/Q ≈ 0.003", "prov": "M25"}, {"source": "cukstewart2012", "rel": "proposes", "target": "mech_impact", "evidence": "Fast-spinning Earth, high-energy impact", "prov": "M25"}, {"source": "meier2024", "rel": "constrains", "target": "c_orbit", "evidence": "Direct formation in a highly eccentric orbit, e ≈ 0.3", "prov": "M25"}, {"source": "chennimmo2016", "rel": "constrains", "target": "c_orbit", "evidence": "Q of a molten Earth is probably higher because of lower dissipation", "prov": "M25"}, {"source": "ringwood1992", "rel": "measures", "target": "iso_Na", "evidence": "MVE elemental depletion of lunar basalts relative to terrestrial basalts", "prov": "M25"}, {"source": "ringwood1992", "rel": "measures", "target": "iso_K", "evidence": "MVE elemental depletion of lunar basalts relative to terrestrial basalts", "prov": "M25"}, {"source": "ringwood1992", "rel": "provides", "target": "c_NaK", "evidence": "Elemental depletion pattern behind the Na/K targets", "prov": "K"}, {"source": "wolfanders1980", "rel": "measures", "target": "iso_K", "evidence": "Alkalis and volatiles in basalts; Moon–Earth compositional differences", "prov": "M25"}, {"source": "wolfanders1980", "rel": "measures", "target": "iso_Na", "evidence": "Alkalis and volatiles in basalts; Moon–Earth compositional differences", "prov": "M25"}]};

  const NODE_TYPES = {
    mechanism:  { label: 'Mechanism',           color: '#f08a3e' },
    framework:  { label: 'Theory framework',    color: '#b48ee6' },
    isotope:    { label: 'Isotope / element',   color: '#e9b949' },
    code:       { label: 'Code / tool',         color: '#6fbf73' },
    sample:     { label: 'Sample set',          color: '#c8a26b' },
    constraint: { label: 'Constraint / result', color: '#5fc3c9' },
  };
  const PAPER_KINDS = {
    measurement: { label: 'Measurement', color: '#7fa7e8' },
    experiment:  { label: 'Experiment',  color: '#4fb3a3' },
    model:       { label: 'Model',       color: '#9a8cf0' },
    theory:      { label: 'Theory',      color: '#d98bc9' },
    review:      { label: 'Review',      color: '#a9b4c2' },
    code:        { label: 'Code paper',  color: '#8fd08a' },
    context:     { label: 'Context',     color: '#6e7883' },
  };
  const EDGE_CLASS = {
    proposes: 'support', supports: 'support', provides: 'support', constrains: 'support', describes: 'support', reviews: 'support',
    challenges: 'conflict', alternative_to: 'conflict', tension: 'conflict',
    builds_on: 'structure', uses: 'structure', applies: 'structure', is_a: 'structure',
    measures: 'data', analyzes: 'data', models: 'data',
  };
  const CLASS_META = {
    support:   { label: 'Supports, proposes, constrains', color: '#c9cbb9', dash: false },
    conflict:  { label: 'Challenges, tension',            color: '#e36a6a', dash: true },
    structure: { label: 'Builds on, uses, applies',       color: '#7c8797', dash: false },
    data:      { label: 'Measures, analyses, models',     color: '#b8a25a', dash: false },
  };
  const PROV_LABEL = GRAPH.meta && GRAPH.meta.provenance ? GRAPH.meta.provenance : {};

  // ---------- data ----------
  const nodes = GRAPH.nodes.map(n => Object.assign({}, n));
  const byId = new Map(nodes.map(n => [n.id, n]));
  const links = GRAPH.edges.map((e, i) => ({
    id: i, source: e.source, target: e.target, rel: e.rel, evidence: e.evidence || '', prov: e.prov || '',
    cls: EDGE_CLASS[e.rel] || 'support',
  }));
  const degree = new Map();
  links.forEach(l => { degree.set(l.source, (degree.get(l.source) || 0) + 1); degree.set(l.target, (degree.get(l.target) || 0) + 1); });
  nodes.forEach(n => {
    n.deg = degree.get(n.id) || 0;
    n.r = n.type === 'paper' ? 5 + Math.sqrt(n.deg) * 1.6 : 8 + Math.sqrt(n.deg) * 1.7;
    n.short = n.short || n.label;
  });
  const idOf = x => (typeof x === 'object' ? x.id : x);
  const colorOf = n => n.type === 'paper' ? (PAPER_KINDS[n.kind] || PAPER_KINDS.context).color : (NODE_TYPES[n.type] || {}).color || '#ccc';
  const typeLabel = n => n.type === 'paper' ? ((PAPER_KINDS[n.kind] || PAPER_KINDS.context).label + ' paper') : (NODE_TYPES[n.type] || {}).label || n.type;
  const relText = r => r.replace(/_/g, ' ');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // ---------- state ----------
  const state = {
    types: new Set(Object.keys(NODE_TYPES).concat(['paper'])),
    kinds: new Set(Object.keys(PAPER_KINDS)),
    classes: new Set(Object.keys(CLASS_META)),
    selected: null, hover: null, query: '',
  };

  // ---------- svg ----------
  const canvas = document.getElementById('canvas');
  const svg = d3.select('#graph');
  const gRoot = svg.append('g');
  const gLinks = gRoot.append('g').attr('class', 'links');
  const gNodes = gRoot.append('g').attr('class', 'nodes');
  const tooltip = document.getElementById('tooltip');
  let width = 800, height = 600;
  function size() {
    const b = canvas.getBoundingClientRect();
    width = Math.max(300, b.width); height = Math.max(300, b.height);
    svg.attr('viewBox', [0, 0, width, height]);
  }
  size();

  const defs = svg.append('defs');
  Object.entries(CLASS_META).forEach(([k, m]) => {
    defs.append('marker').attr('id', 'arrow-' + k).attr('viewBox', '0 -4 8 8').attr('refX', 8).attr('refY', 0)
      .attr('markerWidth', 5).attr('markerHeight', 5).attr('orient', 'auto')
      .append('path').attr('d', 'M0,-4L8,0L0,4').attr('fill', m.color);
  });

  const zoom = d3.zoom().scaleExtent([0.15, 5]).on('zoom', ev => {
    gRoot.attr('transform', ev.transform);
    gRoot.classed('zoomed-out', ev.transform.k < 0.55);
  });
  svg.call(zoom).on('dblclick.zoom', null);
  svg.on('click', ev => { if (ev.target === svg.node()) select(null); });

  const sim = d3.forceSimulation()
    .force('link', d3.forceLink().id(d => d.id)
      .distance(l => (l.source.type === 'paper' && l.target.type === 'paper') ? 65 : 95).strength(0.4))
    .force('charge', d3.forceManyBody().strength(-320).distanceMax(600))
    .force('collide', d3.forceCollide().radius(d => d.r + 14).iterations(2))
    .force('x', d3.forceX(() => width / 2).strength(0.04))
    .force('y', d3.forceY(() => height / 2).strength(0.05))
    .on('tick', ticked);

  let linkSel = gLinks.selectAll('line'), nodeSel = gNodes.selectAll('g.node');
  let first = true;

  function visibleNodes() {
    return nodes.filter(n => n.type === 'paper' ? (state.types.has('paper') && state.kinds.has(n.kind)) : state.types.has(n.type));
  }

  function update() {
    const vis = visibleNodes();
    const visIds = new Set(vis.map(n => n.id));
    const vlinks = links.filter(l => state.classes.has(l.cls) && visIds.has(idOf(l.source)) && visIds.has(idOf(l.target)));

    linkSel = gLinks.selectAll('line').data(vlinks, l => l.id)
      .join(enter => enter.append('line')
        .attr('class', l => l.cls)
        .attr('stroke-width', 1.2)
        .attr('marker-end', l => l.cls === 'data' ? null : `url(#arrow-${l.cls})`));

    nodeSel = gNodes.selectAll('g.node').data(vis, n => n.id)
      .join(enter => {
        const g = enter.append('g').attr('class', 'node').attr('tabindex', 0).attr('role', 'button')
          .attr('aria-label', d => d.short);
        g.each(function (d) {
          const s = d3.select(this);
          if (d.type === 'paper') s.append('circle').attr('r', d.r).attr('fill', colorOf(d));
          else s.append('rect').attr('width', d.r * 2).attr('height', d.r * 2).attr('x', -d.r).attr('y', -d.r).attr('rx', 5).attr('fill', colorOf(d));
          s.append('text').attr('class', d.type === 'paper' ? 'paper-label' : 'concept-label').attr('dy', d.r + 13).text(d.short);
        });
        g.call(d3.drag()
          .on('start', (ev, d) => { if (!ev.active) sim.alphaTarget(0.25).restart(); d.fx = d.x; d.fy = d.y; })
          .on('drag', (ev, d) => { d.fx = ev.x; d.fy = ev.y; })
          .on('end', (ev, d) => { if (!ev.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));
        g.on('mouseenter', (ev, d) => { state.hover = d.id; showTip(ev, d); applyEmphasis(); })
         .on('mousemove', (ev, d) => showTip(ev, d))
         .on('mouseleave', () => { state.hover = null; tooltip.style.display = 'none'; applyEmphasis(); })
         .on('click', (ev, d) => { ev.stopPropagation(); select(d.id === state.selected ? null : d.id); })
         .on('keydown', (ev, d) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); select(d.id); } });
        return g;
      });

    sim.nodes(vis);
    sim.force('link').links(vlinks);
    if (first) { first = false; sim.alpha(1); sim.tick(220); ticked(); fit(); sim.alpha(0.25).restart(); }
    else sim.alpha(0.5).restart();
    applyEmphasis();
    renderDossier();
  }

  function ticked() {
    linkSel.attr('x1', l => l.source.x).attr('y1', l => l.source.y)
      .attr('x2', l => shorten(l).x).attr('y2', l => shorten(l).y);
    nodeSel.attr('transform', d => `translate(${d.x},${d.y})`);
  }
  // stop the line at the target's edge so arrowheads are visible
  function shorten(l) {
    const dx = l.target.x - l.source.x, dy = l.target.y - l.source.y, len = Math.hypot(dx, dy) || 1;
    const pad = l.target.r + 3;
    return { x: l.target.x - dx / len * pad, y: l.target.y - dy / len * pad };
  }

  function showTip(ev, d) {
    tooltip.style.display = 'block';
    tooltip.innerHTML = `<b>${esc(d.short)}</b>${d.type === 'paper' ? esc(d.title) : esc(d.label)}`;
    const b = canvas.getBoundingClientRect();
    let x = ev.clientX - b.left + 14, y = ev.clientY - b.top + 14;
    if (x + 300 > b.width) x = ev.clientX - b.left - 310;
    if (y + 90 > b.height) y = ev.clientY - b.top - 80;
    tooltip.style.left = x + 'px'; tooltip.style.top = y + 'px';
  }

  function neighborsOf(id) {
    const s = new Set([id]);
    links.forEach(l => { if (idOf(l.source) === id) s.add(idOf(l.target)); if (idOf(l.target) === id) s.add(idOf(l.source)); });
    return s;
  }

  function applyEmphasis() {
    const focus = state.hover || state.selected;
    let keep = null;
    if (focus) keep = neighborsOf(focus);
    else if (state.query) {
      const q = state.query.toLowerCase();
      keep = new Set(nodes.filter(n => [n.short, n.label, n.title, n.authors, n.note, n.venue, String(n.year || '')]
        .some(v => v && String(v).toLowerCase().includes(q))).map(n => n.id));
    }
    nodeSel.classed('dim', d => keep ? !keep.has(d.id) : false)
      .classed('lit', d => focus ? (keep.has(d.id) && d.id !== focus) : (keep ? keep.has(d.id) : false))
      .classed('selected', d => d.id === state.selected);
    linkSel.classed('dim', l => keep ? !(keep.has(idOf(l.source)) && keep.has(idOf(l.target))) : false)
      .classed('lit', l => focus ? (idOf(l.source) === focus || idOf(l.target) === focus) : false);
  }

  function select(id) {
    state.selected = id;
    applyEmphasis();
    renderDossier();
  }

  function fit() {
    const vis = sim.nodes(); if (!vis.length) return;
    const xs = vis.map(n => n.x), ys = vis.map(n => n.y);
    const x0 = Math.min(...xs) - 50, x1 = Math.max(...xs) + 50, y0 = Math.min(...ys) - 50, y1 = Math.max(...ys) + 50;
    const k = Math.min(1.2, 0.95 * Math.min(width / (x1 - x0), height / (y1 - y0)));
    const t = d3.zoomIdentity.translate(width / 2 - k * (x0 + x1) / 2, height / 2 - k * (y0 + y1) / 2).scale(k);
    svg.call(zoom.transform, t);
  }

  function locate(id) {
    const n = byId.get(id); if (!n || n.x == null) return;
    const t = d3.zoomIdentity.translate(width / 2, height / 2).scale(1.4).translate(-n.x, -n.y);
    svg.transition().duration(500).call(zoom.transform, t);
  }

  // ---------- dossier ----------
  const dossier = document.getElementById('dossier');
  function renderDossier() {
    const n = state.selected ? byId.get(state.selected) : null;
    if (!n) { renderOverview(); return; }
    const conn = links.filter(l => idOf(l.source) === n.id || idOf(l.target) === n.id);
    const groups = { support: [], conflict: [], structure: [], data: [] };
    conn.forEach(l => groups[l.cls].push(l));
    const adsQ = encodeURIComponent(n.type === 'paper' ? `title:"${n.title}"` : n.label);
    let html = `<div class="type"><i style="background:${colorOf(n)}${n.type === 'paper' ? '' : ';border-radius:3px'}"></i>${esc(typeLabel(n))}</div>`;
    html += `<div class="name">${esc(n.short)}</div>`;
    if (n.type === 'paper') {
      html += `<p class="title">${esc(n.title)}</p>`;
      html += `<p class="meta">${esc(n.authors || '')}${n.year ? ' (' + n.year + ')' : ''}${n.venue ? '. ' + esc(n.venue) : ''}</p>`;
    } else {
      html += `<p class="title">${esc(n.label)}</p>`;
    }
    if (n.note) html += `<p class="note">${esc(n.note)}</p>`;
    html += `<div class="actions">`;
    if (n.link) html += `<a href="${esc(n.link)}" target="_blank" rel="noopener">Open source</a>`;
    if (n.type === 'paper') html += `<a href="https://ui.adsabs.harvard.edu/search/q=${adsQ}" target="_blank" rel="noopener">Find on ADS</a>`;
    html += `<button type="button" data-locate="${esc(n.id)}">Locate on graph</button></div>`;
    const order = ['support', 'conflict', 'structure', 'data'];
    order.forEach(cls => {
      const list = groups[cls]; if (!list.length) return;
      const m = CLASS_META[cls];
      html += `<div class="group-h"><i class="${m.dash ? 'dash' : ''}" style="border-color:${m.color}"></i>${esc(m.label)} (${list.length})</div><ul class="edge-list">`;
      list.sort((a, b) => a.rel.localeCompare(b.rel)).forEach(l => {
        const out = idOf(l.source) === n.id;
        const other = byId.get(out ? idOf(l.target) : idOf(l.source));
        const line = out
          ? `${esc(relText(l.rel))} <button type="button" data-go="${esc(other.id)}">${esc(other.short)}</button>`
          : `<button type="button" data-go="${esc(other.id)}">${esc(other.short)}</button> ${esc(relText(l.rel))} this`;
        html += `<li><div class="rel">${line}</div>`;
        if (l.evidence) html += `<div class="ev">${esc(l.evidence)}</div>`;
        html += `<div class="prov ${l.prov === 'K' ? 'k' : ''}">Source: ${esc(PROV_LABEL[l.prov] || l.prov)}</div></li>`;
      });
      html += `</ul>`;
    });
    dossier.innerHTML = html;
  }

  function renderOverview() {
    const papers = nodes.filter(n => n.type === 'paper').length;
    const concepts = nodes.length - papers;
    const rows = nodes.filter(n => n.type === 'mechanism' || n.type === 'framework').map(n => {
      const inc = links.filter(l => idOf(l.target) === n.id && byId.get(idOf(l.source)).type === 'paper');
      const f = inc.filter(l => l.cls === 'support' || l.cls === 'structure').length;
      const a = inc.filter(l => l.cls === 'conflict').length;
      return { n, f, a };
    }).sort((x, y) => (y.f + y.a) - (x.f + x.a));
    let html = `<h2>Where the evidence points</h2>`;
    html += `<p class="counts">${papers} papers, ${concepts} concepts, ${links.length} links. Each link carries the claim behind it and where that claim came from.</p>`;
    html += `<p class="counts">Papers backing each mechanism or framework (green) against papers challenging it (red). Click a row to open its dossier.</p>`;
    html += `<ul class="balance">`;
    rows.forEach(({ n, f, a }) => {
      const tot = Math.max(1, f + a);
      html += `<li><div><button type="button" data-go="${esc(n.id)}">${esc(n.short)}</button><div class="n">${f} for, ${a} against</div></div>` +
        `<div class="bar"><b class="for" style="width:${(100 * f / tot).toFixed(0)}%"></b><b class="against" style="width:${(100 * a / tot).toFixed(0)}%"></b></div></li>`;
    });
    html += `</ul>`;
    html += `<h3>Reading the graph</h3><p class="counts">Circles are papers (colour = kind); rounded squares are concepts. Dashed red links mark disagreement. Sources tagged “background knowledge” were not verified against the paper text and should be checked before citing.</p>`;
    dossier.innerHTML = html;
  }
  dossier.addEventListener('click', ev => {
    const go = ev.target.closest('[data-go]'); if (go) { select(go.dataset.go); locate(go.dataset.go); return; }
    const loc = ev.target.closest('[data-locate]'); if (loc) locate(loc.dataset.locate);
  });

  // ---------- filters ----------
  function chip(container, key, label, color, shape, set, onChange) {
    const l = document.createElement('label'); l.className = 'chip';
    const i = document.createElement('input'); i.type = 'checkbox'; i.checked = set.has(key);
    const sw = document.createElement('i'); sw.className = shape;
    if (shape.startsWith('ln')) sw.style.borderColor = color; else sw.style.background = color;
    l.append(i, sw, document.createTextNode(label));
    i.addEventListener('change', () => { if (i.checked) set.add(key); else set.delete(key); l.classList.toggle('off', !i.checked); onChange(); });
    container.appendChild(l);
  }
  const tc = document.getElementById('type-chips');
  Object.entries(NODE_TYPES).forEach(([k, m]) => chip(tc, k, m.label, m.color, 'sq', state.types, update));
  const kc = document.getElementById('kind-chips');
  Object.entries(PAPER_KINDS).forEach(([k, m]) => chip(kc, k, m.label, m.color, '', state.kinds, update));
  const cc = document.getElementById('class-chips');
  Object.entries(CLASS_META).forEach(([k, m]) => chip(cc, k, m.label, m.color, 'ln' + (m.dash ? ' dash' : ''), state.classes, update));

  // ---------- header tools ----------
  const q = document.getElementById('q');
  q.addEventListener('input', () => { state.query = q.value.trim(); applyEmphasis(); });
  q.addEventListener('keydown', ev => {
    if (ev.key !== 'Enter' || !state.query) return;
    const qq = state.query.toLowerCase();
    const hit = visibleNodes().find(n => [n.short, n.label, n.title, n.authors].some(v => v && String(v).toLowerCase().includes(qq)));
    if (hit) { select(hit.id); locate(hit.id); }
  });
  document.getElementById('reset').addEventListener('click', () => {
    q.value = ''; state.query = ''; select(null);
    fit();
  });
  document.getElementById('download').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(GRAPH, null, 1)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'graph.json'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape') { select(null); q.blur(); } });
  window.addEventListener('resize', () => { size(); sim.force('x').x(width / 2); sim.force('y').y(height / 2); sim.alpha(0.2).restart(); });

  if (GRAPH.meta && GRAPH.meta.title) document.title = GRAPH.meta.title;
  update();
})();
</script>
</body>
</html>
